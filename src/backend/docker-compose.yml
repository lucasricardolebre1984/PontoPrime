# Docker Compose para PontoPrime - Versão Full
# Stack: Backend (FastAPI) + PostgreSQL + Nginx

version: '3.8'

services:
  # Banco de Dados PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: pontoprime_db
    environment:
      POSTGRES_USER: ${DB_USER:-pontoprime}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pontoprime2025}
      POSTGRES_DB: ${DB_NAME:-pontoprime_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pontoprime}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pontoprime_network

  # Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pontoprime_backend
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-pontoprime}:${DB_PASSWORD:-pontoprime2025}@db:5432/${DB_NAME:-pontoprime_db}

      # Security
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION: 30

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ../web:/app/static
    restart: unless-stopped
    networks:
      - pontoprime_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (HTTPS)
  nginx:
    image: nginx:alpine
    container_name: pontoprime_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../web:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pontoprime_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  pontoprime_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
