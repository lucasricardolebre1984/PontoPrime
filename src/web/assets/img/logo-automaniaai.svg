<!-- Logo AutoManiaAI - Moderno e Tecnológico -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Fundo gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ícone de Engrenagem/Automação -->
  <circle cx="40" cy="40" r="28" fill="url(#grad1)"/>
  <path d="M 40 20 L 43 25 L 48 23 L 50 28 L 55 28 L 55 32 L 60 35 L 57 40 L 60 45 L 55 48 L 55 52 L 50 52 L 48 57 L 43 55 L 40 60 L 37 55 L 32 57 L 30 52 L 25 52 L 25 48 L 20 45 L 23 40 L 20 35 L 25 32 L 25 28 L 30 28 L 32 23 L 37 25 Z"
        fill="#ff6f00" stroke="#fff" stroke-width="1"/>
  <circle cx="40" cy="40" r="8" fill="url(#grad2)"/>

  <!-- Texto AutoManiaAI -->
  <text x="75" y="35" font-family="'Arial Black', sans-serif" font-size="20" font-weight="bold" fill="#1a237e">
    AutoMania
  </text>
  <text x="75" y="55" font-family="'Arial Black', sans-serif" font-size="20" font-weight="bold" fill="url(#grad2)">
    AI
  </text>

  <!-- Linha decorativa -->
  <rect x="75" y="60" width="150" height="2" fill="url(#grad2)"/>
  <text x="75" y="72" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Soluções Inteligentes em Automação
  </text>
</svg>
