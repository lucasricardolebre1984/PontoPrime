<!-- Logo PLANTHERM - Oficial -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066A1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004D7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#689F38;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Texto PLAN (Azul) -->
  <text x="10" y="60" font-family="'Arial Black', 'Helvetica', sans-serif"
        font-size="54" font-weight="900" fill="url(#gradBlue)" letter-spacing="-2">
    PLAN
  </text>

  <!-- Texto THERM (Verde) -->
  <text x="155" y="60" font-family="'Arial Black', 'Helvetica', sans-serif"
        font-size="54" font-weight="900" fill="url(#gradGreen)" letter-spacing="-2">
    THERM
  </text>

  <!-- Slogan -->
  <text x="12" y="85" font-family="Arial, sans-serif"
        font-size="12" fill="#666" letter-spacing="1">
    Excelência em Projetos e Soluções
  </text>
</svg>
